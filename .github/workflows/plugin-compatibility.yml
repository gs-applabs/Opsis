# Release gate for Opsis 2.8.0.2500. Runs only on an isolated, disposable Windows GitHub runner.
# The .NET plugins are loaded inside the real Opsis.Studio.exe (not only compile-checked).
# The Electron Media Suite is an independent application, not an IOpsisNewsCrawlerPlugin.
name: Opsis 2.8 plugin compatibility
on:
  workflow_dispatch:
    inputs:
      crawler_ref:
        description: 'News Crawler branch/ref for the staged plugin DLL'
        required: false
        default: 'release/plugin-dll-1.0.0.0-opsis-280'
        type: string
      chronikologio_ref:
        description: 'Chronikologio branch/ref for the staged plugin DLL'
        required: false
        default: 'release/plugin-dll-1.0.0.0-opsis-280'
        type: string
  pull_request:
    paths:
      - 'src/Services/PluginHost.cs'
      - 'src/Services/DesktopDiagnostics.cs'
      - 'suite/apps.json'
      - 'Opsis.Studio.csproj'
      - 'lib/Opsis.UI.dll'
      - 'lib/OpsisNewsCrawler.Plugin.Abstractions.dll'
      - 'tests/**'
      - '.github/workflows/plugin-compatibility.yml'
permissions:
  contents: read
jobs:
  plugins:
    name: Crawler + Chronikologio in .NET 11 host
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gs-applabs/OpsisNewsCrawler
          ref: ${{ inputs.crawler_ref || 'release/plugin-dll-1.0.0.0-opsis-280' }}
          path: _compat/crawler
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gs-applabs/san-shmera
          ref: ${{ inputs.chronikologio_ref || 'release/plugin-dll-1.0.0.0-opsis-280' }}
          path: _compat/chronikologio
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Check source and test-suite consistency
        shell: pwsh
        run: |
          node --test
          if ($LASTEXITCODE -ne 0) { throw 'Node integration checks failed' }
      - name: Build Opsis, both plugins, and run their tests
        shell: pwsh
        run: |
          dotnet publish Opsis.Studio.csproj -c Release -r win-x64 --self-contained false -o publish -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Opsis build failed' }
          dotnet test _compat/crawler/tests/OpsisNewsCrawler.Core.Tests/OpsisNewsCrawler.Core.Tests.csproj -c Release -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Crawler Core tests failed' }
          dotnet test _compat/crawler/tests/OpsisNewsCrawler.Plugin.Tests/OpsisNewsCrawler.Plugin.Tests.csproj -c Release -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Crawler plugin tests failed' }
          dotnet test _compat/chronikologio/tests/Chronikologio.Core.Tests/Chronikologio.Core.Tests.csproj -c Release -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Chronikologio Core tests failed' }
          dotnet test _compat/chronikologio/tests/Chronikologio.Plugin.Tests/Chronikologio.Plugin.Tests.csproj -c Release -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Chronikologio plugin tests failed' }
          dotnet publish _compat/crawler/src/OpsisNewsCrawler.OpsisPlugin/OpsisNewsCrawler.OpsisPlugin.csproj -c Release -o plugin-crawler -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Crawler plugin publish failed' }
          dotnet publish _compat/chronikologio/src/Chronikologio.OpsisPlugin/Chronikologio.OpsisPlugin.csproj -c Release -o plugin-chronikologio -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Chronikologio plugin publish failed' }
      - name: Verify plugin 1.0.0.0 and host ABI identities
        shell: pwsh
        run: |
          ./tools/check-plugin-dll-versions.ps1 -CrawlerDir plugin-crawler -ChronikologioDir plugin-chronikologio -HostDir publish
          if ($LASTEXITCODE -ne 0) { throw 'Plugin DLL ABI version gate failed' }
      - name: Verify shared assembly identities before loading
        shell: pwsh
        run: |
          $shared = @(
            @{ n='Opsis.UI'; host='publish/Opsis.UI.dll'; other=@('_compat/crawler/libs/Opsis.UI.dll', '_compat/chronikologio/libs/Opsis.UI.dll') },
            @{ n='OpsisNewsCrawler.Plugin.Abstractions'; host='publish/OpsisNewsCrawler.Plugin.Abstractions.dll'; other=@('_compat/chronikologio/libs/OpsisNewsCrawler.Plugin.Abstractions.dll','plugin-crawler/OpsisNewsCrawler.Plugin.Abstractions.dll') }
          )
          foreach ($lib in $shared) {
            if (-not (Test-Path $lib.host)) { throw "Host shared DLL missing: $($lib.host)" }
            $hostName = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $lib.host).Path)
            if ($hostName.Name -ne $lib.n) { throw "Wrong host assembly identity: $($hostName.FullName)" }
            foreach ($path in $lib.other) {
              if (-not (Test-Path $path)) { throw "Plugin shared DLL missing: $path" }
              $other = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $path).Path)
              if ($other.Name -ne $hostName.Name -or $other.Version -gt $hostName.Version) {
                throw "Incompatible $($lib.n): host=$($hostName.FullName), plugin=$($other.FullName) ($path)"
              }
              "compatible assembly: $path -> $($hostName.FullName)"
            }
          }
          # Plugin assembly identity is a different thing from the shared host contract ABI.
          # The new PLUGIN DLLs must be exactly 1.0.0.0, but the shared contract
          # stays 0.8.0.0 and Opsis.UI keeps its own independent assembly version.
          foreach ($spec in @(
            @{ name='Crawler'; path='plugin-crawler/OpsisNewsCrawler.OpsisPlugin.dll' },
            @{ name='Chronikologio'; path='plugin-chronikologio/Chronikologio.OpsisPlugin.dll' }
          )) {
            if (-not (Test-Path $spec.path)) { throw "$($spec.name) plugin DLL missing: $($spec.path)" }
            $fullPath = (Resolve-Path $spec.path).Path
            $asm = [Reflection.AssemblyName]::GetAssemblyName($fullPath)
            $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($fullPath).FileVersion
            if ($asm.Version.ToString() -ne '1.0.0.0' -or $fileVersion -ne '1.0.0.0') {
              throw "$($spec.name) plugin requires 1.0.0.0: assembly=$($asm.Version), file=$fileVersion"
            }
            Write-Host "Verified $($spec.name) plugin DLL version: 1.0.0.0"
          }
          $contractPath = (Resolve-Path 'publish/OpsisNewsCrawler.Plugin.Abstractions.dll').Path
          if ([Reflection.AssemblyName]::GetAssemblyName($contractPath).Version.ToString() -ne '0.8.0.0') {
            throw 'Shared plugin contract unexpectedly changed; ABI migration is required'
          }
          # The host's bundled Opsis.UI must have 0.4.5 features used by the new plugins.
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'publish/Opsis.UI.dll').Path)
          $metadata = [Text.Encoding]::UTF8.GetString($bytes)
          foreach ($member in @('GlossPresets','SettingsStore','OpsisWindow')) {
            if (-not $metadata.Contains($member)) { throw "Host Opsis.UI missing $member" }
          }
      - name: Load both plugins inside Opsis and verify calendar + feeds
        shell: pwsh
        run: |
          $ap = Join-Path $env:RUNNER_TEMP 'opsis-compat-appdata'
          $env:OPSIS_APPDATA = $ap
          $env:OPSIS_E2E = '1'
          $c = Join-Path $ap 'plugins/Crawler'; $h = Join-Path $ap 'plugins/Chronikologio'
          New-Item -ItemType Directory -Force $c,$h,'compat-results' | Out-Null
          Copy-Item plugin-crawler/* $c -Force -Recurse
          Copy-Item plugin-chronikologio/* $h -Force -Recurse
          # Both assemblies implement the real host contract; no mocking of the loader.
          $p = Start-Process (Resolve-Path 'publish/Opsis.Studio.exe').Path -ArgumentList '--test-plugin-widget',((Resolve-Path 'compat-results').Path) -PassThru
          if (-not $p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; throw 'Real plugin smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "Plugin host exited $($p.ExitCode)" }
          $summary = Get-Content compat-results/plugin-widget.txt -Raw
          Write-Host $summary
          if ($summary -notmatch 'replaced=True') { throw 'Chronikologio did not replace the calendar widget' }
          if ($summary -notmatch 'chronikologio') { throw 'Chronikologio plugin was not loaded' }
          if ($summary -notmatch 'giorstergiopoulos.opsisnewscrawler') { throw 'Crawler plugin was not loaded' }
          if ($summary -notmatch 'san-simera') { throw 'Chronikologio did not register the On this day feed' }
          if ($summary -notmatch 'pluginDlls=.*giorstergiopoulos\.opsisnewscrawler@1\.0\.0\.0') { throw 'Crawler plugin did not load DLL version 1.0.0.0' }
          if ($summary -notmatch 'pluginDlls=.*chronikologio@1\.0\.0\.0') { throw 'Chronikologio plugin did not load DLL version 1.0.0.0' }
          $log = Join-Path $ap 'plugins.log'
          if (Test-Path $log) {
            Copy-Item $log compat-results/plugins.log
            if (Select-String $log -Pattern 'Failed to load|failed to start|MissingMethodException|ReflectionTypeLoadException|FileLoadException' -Quiet) { throw 'Plugin log contains a host compatibility error' }
          } else { throw 'No plugin trust/load log was produced' }
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsis-280-real-plugin-compatibility
          path: compat-results/
          if-no-files-found: warn
          retention-days: 14
  media-suite:
    name: Electron Media Suite integration
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gs-applabs/OpsisMediaSuite
          path: _compat/media-suite
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert Media Suite is catalogued as a separate application
        shell: pwsh
        run: |
          $apps = Get-Content suite/apps.json -Raw | ConvertFrom-Json
          $media = $apps.apps | Where-Object id -eq mediasuite
          if (-not $media -or $media.repo -ne 'OpsisMediaSuite') { throw 'Opsis family catalogue lost Media Suite' }
          if (-not ($media.paths -match 'Opsis Media Suite.exe')) { throw 'Missing Media Suite executable path' }
          $chronikologio = $apps.apps | Where-Object id -eq chronikologio
          if (-not $chronikologio -or $chronikologio.repo -ne 'san-shmera') { throw 'Chronikologio is absent from the family catalogue' }
      - name: Install required FFmpeg and Media Suite test dependencies
        shell: pwsh
        working-directory: _compat/media-suite
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Media Suite dependency installation failed' }
      - name: Execute Media Suite security, unit and renderer tests
        shell: pwsh
        working-directory: _compat/media-suite
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Media Suite tests failed' }
          npm run selftest
          if ($LASTEXITCODE -ne 0) { throw 'Electron integration self-test failed' }
