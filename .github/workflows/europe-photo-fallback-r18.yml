name: Europe real photo fallback R18
on:
  push:
    branches: [feat/europe-photo-acquisition-r17]
    paths: ['.github/workflows/europe-photo-fallback-r18.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python addons/opsis-100/authoring/acquire-batches-r18.py --catalog addons/opsis-100/authoring/europe-capitals.json --out review --batch ${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Europe-photo-review-R18-batch-${{ matrix.batch }}
          path: review/
          if-no-files-found: warn
          retention-days: 14
