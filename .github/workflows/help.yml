name: Opsis Studio 22 Help regression
on:
  push:
    branches: [opsis-studio22-help-check]
permissions:
  contents: read
jobs:
  help:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - name: Verify Info, License and History transitions
        shell: pwsh
        run: |
          Expand-Archive check.zip -DestinationPath check
          Set-Location check
          dotnet run --project HelpRegression.csproj -c Release
          exit $LASTEXITCODE
