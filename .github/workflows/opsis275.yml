name: Opsis Studio Inno Setup 7
on:
  push:
    branches: [opsis-275-wallpaper-check]
permissions:
  contents: read
jobs:
  inno:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bc56d152f290876606e4f9c186a1f073bb255423
          path: classic
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - name: Exercise native gallery, previews and Explorer registration
        run: dotnet run --project check/GalleryCheck.csproj -c Release
      - name: Verify the weather compositor in Chromium
        run: |
          $browser = Join-Path ${env:ProgramFiles} 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $browser)) {
            $browser = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          }
          $profile = Join-Path $env:RUNNER_TEMP 'opsis-browser-profile'
          $html = (Resolve-Path 'weather-check/weather-regression.html').Path
          $uri = ([System.Uri]::new($html)).AbsoluteUri
          $out = Join-Path $env:RUNNER_TEMP 'weather-result.html'
          $errors = Join-Path $env:RUNNER_TEMP 'weather-browser.log'
          $flags = @('--headless=new','--disable-gpu','--no-first-run','--disable-background-networking','--allow-file-access-from-files','--dump-dom','--virtual-time-budget=14000',"`"--user-data-dir=$profile`"", $uri)
          $p = Start-Process $browser -ArgumentList $flags -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $errors
          Get-Content $out
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $out -SimpleMatch '<body>WEATHER_PASS')) {
            Get-Content $errors | Select-Object -Last 40
            throw 'Weather compositor regression checks failed'
          }
      - name: Fetch and verify Inno Setup 7.1.1
        run: |
          $inno = Join-Path $env:RUNNER_TEMP 'inno-7.1.1.exe'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          Invoke-WebRequest $url -OutFile $inno
          $signature = Get-AuthenticodeSignature $inno
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Unexpected Inno installer signature: $($signature.Status)"
          }
          $toolpath = Join-Path $env:RUNNER_TEMP 'Inno7'
          $p = Start-Process $inno -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$toolpath" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Inno Setup did not install' }
          "ISCC=$toolpath\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build the Opsis Studio installer
        if: success() || failure()
        run: |
          Copy-Item classic\assets assets -Recurse
          Copy-Item classic\installer\wizard installer\wizard -Recurse
          Copy-Item classic\installer\*.isl installer
          & $env:ISCC /DExternalPayload installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno compilation failed' }
      - name: Verify install and uninstall using test files
        if: success() || failure()
        run: |
          $setup = Get-Item Output\Opsis-Studio-*-Setup-x64.exe
          $payload = New-Item -ItemType Directory -Force (Join-Path $setup.DirectoryName 'payload')
          foreach ($name in @('Opsis.Studio.exe', 'Opsis.Studio.dll', 'Opsis.Studio.deps.json', 'Opsis.Studio.runtimeconfig.json')) {
            Set-Content -LiteralPath (Join-Path $payload.FullName $name) -Value 'installer test fixture'
          }
          New-Item -ItemType Directory -Force (Join-Path $payload.FullName 'suite\icons') | Out-Null
          Set-Content -LiteralPath (Join-Path $payload.FullName 'suite\icons\check.txt') -Value 'recursive payload'
          $dir = Join-Path $env:RUNNER_TEMP 'OpsisStudioSmoke'
          $log = Join-Path $env:RUNNER_TEMP 'opsis-install.log'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DEPS=none',"/DIR=$dir","/LOG=$log" -Wait -PassThru
          Get-Content $log | Select-Object -Last 25
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\suite\icons\check.txt")) { throw 'Installer did not copy the full test fixture' }
          $sourceDll = Join-Path $payload.FullName 'Opsis.Studio.dll'
          $denyLog = Join-Path $env:RUNNER_TEMP 'opsis-source-denied.log'
          $updateLog = Join-Path $env:RUNNER_TEMP 'opsis-update.log'
          $old = Get-Content "$dir\Opsis.Studio.dll" -Raw
          $lock = [IO.File]::Open($sourceDll, [IO.FileMode]::Open, [IO.FileAccess]::ReadWrite, [IO.FileShare]::None)
          try {
            $denied = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DEPS=none',"/DIR=$dir","/LOG=$denyLog" -PassThru
            if (-not $denied.WaitForExit(15000)) { Stop-Process -Id $denied.Id -Force; throw 'Setup blocked while the source was not readable' }
            if ($denied.ExitCode -eq 0 -or (Get-Content "$dir\Opsis.Studio.dll" -Raw) -ne $old -or -not (Select-String -LiteralPath $denyLog -SimpleMatch 'Cannot read payload file Opsis.Studio.dll' -Quiet)) {
              throw 'Access-denied preflight did not protect the installed DLL'
            }
            Write-Output 'PASS: a source sharing violation is detected before the installation is changed'
          } finally { $lock.Dispose() }
          Set-Content -LiteralPath $sourceDll -Value 'updated assembly fixture'
          $updated = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DEPS=none',"/DIR=$dir","/LOG=$updateLog" -Wait -PassThru
          if ($updated.ExitCode -ne 0 -or (Get-Content "$dir\Opsis.Studio.dll") -ne 'updated assembly fixture') { throw 'In-place update failed' }
          Write-Output 'PASS: in-place update replaces the DLL once the payload is readable'
          $entry = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{0F9363FA-64CB-45CF-8D70-E748B9C5BDA8}_is1'
          if ((Get-ItemProperty $entry).DisplayVersion -ne '2.7.5.2400') { throw 'Wrong version or product registration' }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$dir\Opsis.Studio.exe") -or (Test-Path $entry)) { throw 'Uninstall did not clear the test install' }
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: opsis-275-wallpaper-setup
          path: Output/*.exe
          if-no-files-found: error
          retention-days: 3
