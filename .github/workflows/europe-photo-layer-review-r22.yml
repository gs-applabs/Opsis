name: Europe real photo layer review R22
on:
  push:
    branches: [feat/europe-photo-acquisition-r17]
    paths: ['.github/workflows/europe-photo-layer-review-r22.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow numpy opencv-python-headless
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45616021185
          pattern: Europe-photo-review-R18-batch-*
          path: incoming/r18
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45616359855
          name: Europe-exact-viewpoint-corrections-R19
          path: incoming/r19
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45616599486
          name: Europe-exact-viewpoint-corrections-R20
          path: incoming/r20
      - name: Build review-only aligned layers
        shell: bash
        run: |
          for batch in 0 1 2 3; do
            python addons/opsis-100/authoring/build-photo-review-r22.py --manifest addons/opsis-100/authoring/europe-photo-review-r21.json --input incoming --out review/batch-${batch} --batch "$batch"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Europe-photo-layer-review-R22
          path: review/
          if-no-files-found: error
          retention-days: 14
