name: OPSIS R28 unified build checks
on:
  push:
    branches: [integration/opsis-unified-source-r27]
    paths: ['.github/workflows/unified-r28-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet build Opsis.csproj -c Release -p:Platform=x64
      - run: node --check src/Widgets/wallpaper/weather.js
      - run: node --test tests/WallpaperIdle.test.cjs tests/WeatherInfoTone.test.cjs
