name: OPSIS unified RC build checks
on:
  push:
    branches: [integration/opsis-unified-source-r27]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: opsis-unified-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared Windows RC verification
        shell: pwsh
        run: ./tools/verify-windows-rc.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Opsis-RC-verification
          path: ci-results/verification.json
          if-no-files-found: warn
