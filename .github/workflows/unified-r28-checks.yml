name: OPSIS unified RC build checks
on:
  push:
    branches: [integration/opsis-unified-source-r27]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: opsis-unified-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet build Opsis.csproj -c Release -p:Platform=x64
      - name: Experience smoke and SSD read regression
        run: dotnet run --project tests/Opsis.ExperienceSmoke/Opsis.ExperienceSmoke.csproj -c Release
      - run: node --check src/Widgets/wallpaper/weather.js
      - run: node --check src/Music/wallpaper-music.js
      - run: node --test tests/WallpaperIdle.test.cjs tests/WeatherInfoTone.test.cjs
