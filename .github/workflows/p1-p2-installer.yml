name: Opsis P1-P2 installer integration
on:
  push:
    branches: [feat/p1-shell-customization-2.8.0.2510]
  pull_request:
    branches: [feat/p0-from-2.8.0.2510]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-upgrade-uninstall:
    name: Inno 7 Windows installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Restore and publish x64
        run: |
          dotnet restore Opsis.csproj --disable-parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish Opsis.csproj -c Release -r win-x64 --self-contained false -o publish -m:1 -p:UseSharedCompilation=false -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path publish/Opsis.exe)) { throw 'Missing Opsis.exe' }
      - name: Install signed Inno Setup 7.1.1 compiler
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $download
          $sig = Get-AuthenticodeSignature -FilePath $download
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'Official Inno Setup Authenticode signature validation failed'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          $args = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $installDir + '"'
          $p = Start-Process -FilePath $download -ArgumentList $args -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Inno 7 setup failed: $($p.ExitCode)" }
          $exe = Join-Path $installDir 'ISCC.exe'
          if (!(Test-Path $exe)) { throw "Inno Setup compiler missing at $exe" }
          "INNO_COMPILER=$exe" >> $env:GITHUB_ENV
      - name: Compile Opsis installer
        run: |
          & $env:INNO_COMPILER installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = @(Get-ChildItem Output -Filter 'OpsisSetup-*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1)
          if ($setup.Count -ne 1) { throw 'Exactly one Opsis setup expected' }
          "OPSIS_SETUP=$($setup[0].FullName)" >> $env:GITHUB_ENV
          Get-FileHash $setup[0].FullName -Algorithm SHA256 | Format-List
      - name: Fresh install, in-place reinstall and uninstall
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Opsis-P1P2-InstallerTest'
          $args = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $target + '"'
          foreach ($pass in @('clean-install', 'in-place-reinstall')) {
            $p = Start-Process -FilePath $env:OPSIS_SETUP -ArgumentList $args -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Setup failed ($pass): $($p.ExitCode)" }
            $installed = Join-Path $target 'Opsis.exe'
            if (!(Test-Path $installed)) { throw "Installed EXE missing ($pass)" }
            Write-Host "PASS $pass: $installed"
          }
          $uninstaller = @(Get-ChildItem -Path $target -Filter 'unins*.exe' -File | Select-Object -First 1)
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller not found' }
          $p = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path (Join-Path $target 'Opsis.exe')) { throw 'Opsis.exe remains after uninstall' }
          Write-Host 'PASS silent uninstall'
      - name: Write integrity evidence
        if: success()
        run: |
          Get-FileHash -Path $env:OPSIS_SETUP -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Out-File -FilePath Output/SHA256SUMS.txt -Encoding utf8
      - name: Preserve installer and validation output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opsis-installer-${{ matrix.os }}
          path: |
            Output/OpsisSetup-*.exe
            Output/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
