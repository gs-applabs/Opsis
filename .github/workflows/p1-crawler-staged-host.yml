name: Opsis 0.28.0 staged Crawler contract compatibility
on:
  push:
    paths:
      - '.github/workflows/p1-crawler-staged-host.yml'
      - 'src/Services/PluginHost.cs'
      - 'src/Widgets/WidgetEngine.cs'
      - 'src/UI/MainWindow.cs'
  pull_request:
    paths:
      - '.github/workflows/p1-crawler-staged-host.yml'
      - 'src/Services/PluginHost.cs'
      - 'src/Widgets/WidgetEngine.cs'
      - 'src/UI/MainWindow.cs'

permissions:
  contents: read

jobs:
  compatible-bridge:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: host
      - uses: actions/checkout@v4
        with:
          repository: gs-applabs/OpsisNewsCrawler
          ref: release/p3-v0.28.0-contract1-20261123
          path: crawler
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile shared contract and 0.28.0 Crawler in isolated runner
        shell: pwsh
        run: |
          dotnet build crawler/src/OpsisNewsCrawler.Plugin.Abstractions/OpsisNewsCrawler.Plugin.Abstractions.csproj -c Release
          dotnet build crawler/src/OpsisNewsCrawler.OpsisPlugin/OpsisNewsCrawler.OpsisPlugin.csproj -c Release
      - name: Stage single shared contract binary without committing or deploying
        shell: pwsh
        run: |
          $dll = 'crawler/src/OpsisNewsCrawler.Plugin.Abstractions/bin/Release/net10.0-windows/OpsisNewsCrawler.Plugin.Abstractions.dll'
          Copy-Item $dll host/libs/OpsisNewsCrawler.Plugin.Abstractions.dll -Force
          $expected = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $dll)).Version.ToString()
          if ($expected -ne '1.0.0.0') { throw "Breaking contract version $expected" }
      - name: Publish the REAL Crawler plugin with all runtime dependencies
        shell: pwsh
        run: |
          dotnet publish crawler/src/OpsisNewsCrawler.OpsisPlugin/OpsisNewsCrawler.OpsisPlugin.csproj -c Release -o staged-crawler -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Crawler plugin publish failed' }
          $stagedContract = 'staged-crawler/OpsisNewsCrawler.Plugin.Abstractions.dll'
          $hostContract = 'host/libs/OpsisNewsCrawler.Plugin.Abstractions.dll'
          Copy-Item $hostContract $stagedContract -Force
          $same = (Get-FileHash $stagedContract -Algorithm SHA256).Hash -eq (Get-FileHash $hostContract -Algorithm SHA256).Hash
          if (-not $same) { throw 'Crawler and Opsis host did not receive the same contract binary' }
      - name: Host and REAL Crawler plugin load tests against identical ABI 1.0.0.0
        shell: pwsh
        working-directory: host
        run: |
          dotnet build MotionDeskStudio.csproj -c Release -m:1 -p:SkipContainers=true
          if ($LASTEXITCODE -ne 0) { throw 'Opsis host build failed' }
          $env:OPSIS_P3_CONTRACT_TEST = '1'
          $env:OPSIS_P3_INTEGRATION_REQUIRED = '1'
          $env:OPSIS_REAL_CRAWLER_PLUGIN_DIR = (Resolve-Path '../staged-crawler').Path
          dotnet test tests/Opsis.Tests/Opsis.Tests.csproj -c Release -m:1 --filter "FullyQualifiedName~PluginWidgetContractTests"
          if ($LASTEXITCODE -ne 0) { throw 'Real Crawler DLL host loading/integration tests failed' }
      - name: Check plugin DLL AssemblyVersion and FileVersion
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'staged-crawler/OpsisNewsCrawler.OpsisPlugin.dll').Path
          $v = [System.Reflection.AssemblyName]::GetAssemblyName($dll).Version.ToString()
          $file = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
          if ($v -ne '1.0.0.0' -or $file -ne '1.0.0.0') {
            throw "Wrong Crawler plugin identity: AssemblyVersion=$v; FileVersion=$file"
          }
          Write-Host "Real Crawler plugin $v loaded and validated with Opsis host contract 1.0.0.0"
