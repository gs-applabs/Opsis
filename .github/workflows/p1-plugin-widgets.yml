name: Opsis P1 additional plugin widgets
on:
  push:
    paths:
      - 'src/Services/PluginHost.cs'
      - 'src/Widgets/WidgetEngine.cs'
      - 'src/UI/MainWindow.cs'
      - 'tests/Opsis.Tests/PluginWidgetContractTests.cs'
      - '.github/workflows/p1-plugin-widgets.yml'
  pull_request:
    paths:
      - 'src/Services/PluginHost.cs'
      - 'src/Widgets/WidgetEngine.cs'
      - 'src/UI/MainWindow.cs'
      - 'tests/Opsis.Tests/PluginWidgetContractTests.cs'
      - '.github/workflows/p1-plugin-widgets.yml'

permissions:
  contents: read

jobs:
  test-widget-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile Opsis without replacing bundled DLLs
        shell: pwsh
        run: dotnet build MotionDeskStudio.csproj -c Release -m:1 -p:SkipContainers=true
      - name: Test plugin widget contract and legacy calendar replacement
        shell: pwsh
        run: dotnet test tests/Opsis.Tests/Opsis.Tests.csproj -c Release -m:1 --filter "FullyQualifiedName~PluginWidgetContractTests"
