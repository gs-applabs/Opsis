name: Opsis RC source-only Claude handoff
on:
  push:
    branches: [feat/p0-p1-unified-capability-switcher]
  pull_request:
    branches: [test/3.0.0.3200-rc-vm-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify baseline and source-only archive
        run: |
          python tests/integration/check_baseline_and_release.py
          python tools/build_source_handoff.py --output out/Opsis-3.0.0.3200-RC-source-no-wallpaper-media.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Opsis-3.0.0.3200-RC-source-no-wallpaper-media
          path: out/*
          if-no-files-found: error
          retention-days: 30
