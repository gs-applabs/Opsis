# Optional second hosted provider. No deployment and no paid resources created.
trigger: none
pr: none
pool:
  vmImage: windows-2025
steps:
  - checkout: self
    persistCredentials: false
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      useGlobalJson: true
      workingDirectory: $(Build.SourcesDirectory)
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
  - powershell: ./tools/verify-windows-rc.ps1
    displayName: Verify exact checkout
  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: ci-results
      artifact: Opsis-RC-verification
