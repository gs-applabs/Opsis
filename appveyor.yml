# Open-source Windows CI; enable this repository in AppVeyor once.
image: Visual Studio 2026
version: 3.0.0.{build}
branches:
  only:
    - integration/opsis-unified-source-r27
clone_depth: 1
environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
install:
  - ps: Install-Product node 22
  - ps: |
      $ErrorActionPreference = 'Stop'
      $sdk = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
      $root = Join-Path $env:LOCALAPPDATA 'OpsisCI-dotnet'
      $installer = Join-Path $env:TEMP 'dotnet-install.ps1'
      Invoke-WebRequest -UseBasicParsing https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
      & $installer -Version $sdk -Architecture x64 -InstallDir $root -NoPath
      if (!(Test-Path (Join-Path $root 'dotnet.exe'))) { throw 'SDK installation failed' }
      $env:DOTNET_ROOT = $root
      $env:PATH = "$root;$env:PATH"
build_script:
  - ps: ./tools/verify-windows-rc.ps1
test: off
artifacts:
  - path: ci-results/verification.json
    name: Opsis-RC-verification
